<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ECECEA"/>
      <stop offset="100%" stop-color="#ECECEA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F3F3F1"/>
      <stop offset="100%" stop-color="#F3F3F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#EBEBE8" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#D9D9D6"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="#FFFFFF"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <ellipse cx="1150" cy="180" rx="420" ry="300" fill="url(#glowA)"/>
  <ellipse cx="220" cy="720" rx="380" ry="280" fill="url(#glowB)"/>

  <!-- dotted field top right -->
  <rect x="1050" y="80" width="300" height="180" fill="url(#dots)" opacity="0.8"/>

  <!-- thin arc -->
  <path d="M1080 640 A 220 220 0 0 1 1300 420" stroke="#D5D5D2" stroke-width="1.5"/>
  <path d="M1080 680 A 260 260 0 0 1 1340 420" stroke="#E2E2DF" stroke-width="1.5"/>

  <!-- plus marks -->
  <g stroke="#C9C9C6" stroke-width="1.5" stroke-linecap="round">
    <path d="M180 200h20M190 190v20"/>
    <path d="M1240 700h20M1250 690v20"/>
    <path d="M700 140h16M708 132v16"/>
  </g>

  <!-- small ring -->
  <circle cx="360" cy="220" r="26" stroke="#D5D5D2" stroke-width="1.5"/>
  <circle cx="360" cy="220" r="4" fill="#1A1A1A"/>

  <!-- baseline -->
  <line x1="120" y1="800" x2="420" y2="800" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="812" x2="300" y2="812" stroke="#D5D5D2" stroke-width="2" stroke-linecap="round"/>
</svg>
