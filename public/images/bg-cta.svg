<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" fill="none">
  <defs>
    <radialGradient id="darkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2E2E2E"/>
      <stop offset="100%" stop-color="#2E2E2E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="darkDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#333333"/>
    </pattern>
  </defs>

  <rect width="1440" height="560" fill="#141414"/>
  <rect width="1440" height="560" fill="url(#darkDots)"/>
  <ellipse cx="720" cy="280" rx="520" ry="260" fill="url(#darkGlow)"/>

  <!-- diagonal hairlines -->
  <g stroke="#262626" stroke-width="1">
    <path d="M-40 600 L400 -40"/>
    <path d="M1040 600 L1480 -40"/>
  </g>

  <!-- ring + dot accents -->
  <circle cx="180" cy="120" r="34" stroke="#3A3A3A" stroke-width="1.5"/>
  <circle cx="180" cy="120" r="4" fill="#FFFFFF"/>
  <circle cx="1260" cy="440" r="22" stroke="#3A3A3A" stroke-width="1.5"/>

  <!-- plus marks -->
  <g stroke="#4A4A4A" stroke-width="1.5" stroke-linecap="round">
    <path d="M1230 110h20M1240 100v20"/>
    <path d="M190 440h20M200 430v20"/>
  </g>

  <!-- baseline accent -->
  <line x1="120" y1="470" x2="300" y2="470" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="120" y1="482" x2="220" y2="482" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round"/>
</svg>
